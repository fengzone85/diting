# Go 受控端（agent-go）发布流水线：
#   推送 agent-go-v* 标签 -> 三平台交叉编译 -> SHA256 -> 附加到 GitHub Release。
# Linux 安装器（agent-go/install.sh）与 Windows 安装器（agent-go/install-go.ps1）
# 从 releases/latest/download 拉取产物；钉版本部署用 releases/download/<tag>。
# 构建前先跑 go test，测试不过不出包。
name: agent-go-release

on:
  push:
    tags:
      - 'agent-go-v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    # secrets 不能出现在 if 里：先在中转 env 里求值，步骤内再读 env
    env:
      SIGN_KEY_PRESENT: ${{ secrets.AGENT_RELEASE_SIGN_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: '' }
          - { goos: linux,   goarch: arm64, ext: '' }
          - { goos: windows, goarch: amd64, ext: '.exe' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test
        working-directory: agent-go
        run: go test ./...

      - name: Build
        working-directory: agent-go
        run: |
          V="${GITHUB_REF_NAME#agent-go-}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${V}" \
            -o "dist/diting-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" .

      - name: SHA256
        working-directory: agent-go/dist
        run: |
          F="diting-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          sha256sum "$F" | awk '{print $1}' > "$F.sha256"

      # S5：ed25519 签名（供服务端中继验签）。私钥走 repo secret
      # AGENT_RELEASE_SIGN_KEY（PEM 内容，勿入库）；未配置时跳过签名，
      # 中继会因缺 .sig 而拒绝分发该版本（安装脚本回落 GitHub 直连）。
      #
      # 注意：GitHub 明确禁止在 if 条件里直接引用 secrets 上下文（会让整个工作流
      # 校验失败、0 jobs 跑不起来）。正确做法是 job 级 env 中转，再用 env 判断。
      - name: Sign (ed25519)
        if: ${{ env.SIGN_KEY_PRESENT == 'true' }}
        working-directory: agent-go
        env:
          AGENT_RELEASE_SIGN_KEY: ${{ secrets.AGENT_RELEASE_SIGN_KEY }}
        run: bash ../scripts/sign-agent-release.sh dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agent-go/dist/*
          generate_release_notes: true

  # scratch 镜像推 ghcr（~7.5MB）：latest + 版本号双 tag。
  # 首次推送后包默认私有，需在 GitHub 包设置中改为 public（pull 无需凭证）。
  ghcr:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 双轨凭据：配了 GHCR_TOKEN（classic PAT with write:packages）则优先使用，
      # 否则回退 GITHUB_TOKEN（需 repo Settings → Actions → General →
      # Workflow permissions = Read and write 才能推包）。
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compute version tag
        id: ver
        run: echo "tag=${GITHUB_REF_NAME#agent-go-}" >> "$GITHUB_OUTPUT"

      # 用 CLI 分步 build/push（替代 build-push-action）：
      #   1) 失败点精确可归因（build 还是 push）
      #   2) 规避 action 默认生成 provenance attestation 带来的额外变量
      - name: Build image
        run: |
          docker build \
            --build-arg VERSION=${{ steps.ver.outputs.tag }} \
            -t ghcr.io/fengzone85/diting-agent:latest \
            -t ghcr.io/fengzone85/diting-agent:${{ steps.ver.outputs.tag }} \
            agent-go

      # 诊断 token 的包权限能力（write_package denied 时用于归因：是 token
      # 权限不足，还是 registry 侧问题）。失败不影响后续步骤。
      - name: Diagnose ghcr token permissions
        if: always()
        run: |
          echo "actor=${{ github.actor }} repo=${{ github.repository }} ref=$GITHUB_REF_NAME"
          echo "GHCR_TOKEN set: ${{ secrets.GHCR_TOKEN != '' }}"
          curl -sS -o /dev/null -w 'api_user_packages=%{http_code}\n' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            'https://api.github.com/user/packages?package_type=container' || true
          curl -sS -o /dev/null -w 'api_repo=%{http_code}\n' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            'https://api.github.com/repos/${{ github.repository }}' || true

      - name: Push image
        run: |
          set -x
          docker push ghcr.io/fengzone85/diting-agent:latest
          docker push ghcr.io/fengzone85/diting-agent:${{ steps.ver.outputs.tag }}
