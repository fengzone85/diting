name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            server/web/package-lock.json

      # npm ci 而非 install：lockfile 与 package.json 不一致时直接失败，
      # 避免 CI 装到与本地不同的版本（install 会静默改写 lockfile）。
      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Run npm audit (server)
        working-directory: server
        run: npm audit --audit-level=high
      - name: Run server unit tests
        working-directory: server
        run: npm test 2>&1 | tee /tmp/server-tap.txt; exit ${PIPESTATUS[0]}
      - name: Test baseline gate (H9, 防 0 用例假绿)
        run: node scripts/repo-hygiene-check.mjs --test-baseline --tap-file /tmp/server-tap.txt

      - name: Install web dependencies
        working-directory: server/web
        run: npm ci --no-audit --no-fund
      # 前端依赖此前没有扫描入口（server 侧早已有 audit），此处补齐。
      - name: Run npm audit (web)
        working-directory: server/web
        run: npm audit --audit-level=high
      - name: Run web type check
        working-directory: server/web
        run: npm run typecheck
      - name: Run web unit tests (with coverage gate)
        working-directory: server/web
        run: npm run test:cov
      - name: Run server lint
        working-directory: server
        run: npm run lint
      - name: Run web lint
        working-directory: server/web
        run: npm run lint

  # 仓库纯净度闸门：tracked 全集扫描（白名单/禁扩展名/大文件/凭据/IDE 产物）。
  # 与 pre-commit 同一脚本；钩子可被 --no-verify 绕过，此 job 是第二道防线。
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repo hygiene gate (H1–H8)
        run: node scripts/repo-hygiene-check.mjs --full

  # 受控端（agent-go）此前只在 tag 发布流水线跑测试，master 的 push/PR 没有 Go 门禁。
  # go.mod 零第三方依赖（无 require、无 go.sum），整个 job 约 20s。
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run Go tests
        working-directory: agent-go
        run: go test ./...
