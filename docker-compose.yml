# 一键部署示例 / Quick-start example
# 仅启动监控服务端（仪表盘），用于快速测试/演示。
# Launches only the monitoring server (dashboard) for quick testing / demos.
#
# ⚠️ 该示例在明文 :8081 上暴露服务端，管理员 Token 会以明文传输，
#    请勿用于生产环境。生产请在前端加 Nginx + TLS（见 nginx/monitor.conf.example）。
# ⚠️ This example exposes the server on plaintext :8081 (token travels unencrypted).
#    Do NOT use it for production. Put Nginx + TLS in front for production.

services:
  server:
    build: ./server
    container_name: diting-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    # 快速测试为明文 http，需显式放行（生产经 Nginx+TLS 无需此变量）。
    environment:
      - ADMIN_ALLOW_HTTP=1
      # 数据库写入持久卷 /data（server-data），重建容器后数据不丢失
      - DB_PATH=/data/monitor.db
      # 反代信任边界：默认只信任 loopback。若 Nginx 在另一个容器/主机，
      # 反代源地址不是 127.0.0.1，需显式声明（否则 IP 白名单与限流会把请求全算到反代头上）：
      # - TRUST_PROXY=172.16.0.0/12,10.0.0.8   # IP 或 CIDR，逗号分隔
      # - TRUST_PROXY=1                        # 信任 1 跳
    ports:
      - "8081:8081"
    volumes:
      - server-data:/data

volumes:
  server-data:
