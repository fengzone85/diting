# DiTing 可选 B 路径：无面板 / 无域名的局域网自签 HTTPS 反代。
# 由 `sudo bash diting.sh --bundled-proxy` 启动（compose profile: bundled-proxy）。
# 本文件挂到 nginx:alpine 的 /etc/nginx/conf.d/default.conf，被 nginx.conf 的 http {}
# include，因此 map / limit_req_zone / gzip 可以放在顶层。
#
# 注意：proxy_pass 固定为 127.0.0.1:8081（host network 下的宿主回环）。
# 若 .env 里 PORT 不是 8081，请同步修改本文件所有 8081；安装器会检测并提示。
# A 路径（宝塔 / 1Panel / 已有 Nginx）请勿启用本 profile，它会占用宿主 443。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=report:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=apilimit:10m rate=2r/s;

gzip on;
gzip_min_length 1k;
gzip_comp_level 2;
gzip_types text/plain application/javascript application/x-javascript text/javascript text/css application/xml application/json;
gzip_proxied any;
gzip_vary on;

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 10m;

    # 受控端上报：小 body、独立宽松限流。
    location = /api/report {
        limit_req zone=report burst=5 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 16k;
    }

    # 实时端点（WebSocket / SSE / JSON-RPC）：升级头与长超时缺一不可。
    location ~ ^/api/(clients(/sse)?|rpc2)$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        limit_req zone=apilimit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 管理端鉴权依赖此头。
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
    }
}
